server {
  listen 8080;
  server_tokens off;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://rag-api:8100/; proxy_set_header X-Request-ID $request_id; }
  location / { try_files $uri /index.html; }
}
