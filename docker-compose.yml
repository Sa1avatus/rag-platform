name: rag-platform
services:
  rag-api:
    build:
      context: .
      target: api
    command: uvicorn rag_platform.main:app --host 0.0.0.0 --port 8100
    env_file: .env
    ports: ["127.0.0.1:8100:8100"]
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-redis: {condition: service_healthy}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health/live')"], interval: 10s, timeout: 3s, retries: 10}
    restart: unless-stopped
    deploy: {resources: {limits: {memory: 1G}}}
  rag-indexing-worker:
    build:
      context: .
      target: worker
    command: celery -A rag_platform.worker.celery_app worker --beat --schedule=/tmp/celerybeat-schedule --queues=indexing,search --loglevel=INFO --concurrency=2
    env_file: .env
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-redis: {condition: service_healthy}
      rag-minio: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 60s
    deploy: {resources: {limits: {memory: 6G}}}
  rag-web:
    build: ./web
    ports: ["127.0.0.1:8300:8080"]
    depends_on: [rag-api]
    restart: unless-stopped
    deploy: {resources: {limits: {memory: 256M}}}
  rag-postgres:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_DB: rag, POSTGRES_USER: rag, POSTGRES_PASSWORD: rag-local-password}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["rag_postgres:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U rag"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
  rag-opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:59200:9200"]
    volumes: ["rag_opensearch:/usr/share/opensearch/data"]
    healthcheck: {test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health"], interval: 10s, timeout: 5s, retries: 20}
    restart: unless-stopped
  rag-redis:
    image: redis:7.4.2-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["rag_redis:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
  rag-minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: rag-local-access, MINIO_ROOT_PASSWORD: change-me}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["rag_minio:/data"]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
volumes: {rag_postgres: {}, rag_opensearch: {}, rag_redis: {}, rag_minio: {}}
