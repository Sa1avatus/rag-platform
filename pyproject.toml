[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-platform"
version = "0.1.0"
description = "Multi-tenant ingestion and hybrid retrieval platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "asyncpg>=0.30,<1", "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1", "httpx>=0.28,<1", "minio>=7.2,<8",
  "opensearch-py[async]>=2.8,<3", "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6", "sentence-transformers>=3.3,<4", "sqlalchemy>=2.0.36,<3",
  "structlog>=24.4,<26", "pgvector>=0.3.6,<1", "uvicorn[standard]>=0.34,<1",
  "pypdf>=5.1,<6", "python-docx>=1.1,<2", "beautifulsoup4>=4.12,<5"
]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "pytest-cov>=6,<7", "respx>=0.22,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
addopts = "-q --cov=rag_platform --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
